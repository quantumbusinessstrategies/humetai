<script>
  const bar = document.getElementById('quantum-empire-bar');
  let timeout;

  function showBar() {
    clearTimeout(timeout);
    bar.style.opacity = '1';
    bar.style.pointerEvents = 'auto';
  }

  function hideBar() {
    timeout = setTimeout(() => {
      bar.style.opacity = '0';
      bar.style.pointerEvents = 'none';
    }, 800); // stays visible for 0.8s after mouse leaves
  }

  // Show when mouse is near bottom (last 80px of screen)
  document.addEventListener('mousemove', (e) => {
    if (e.clientY > window.innerHeight - 80) {
      showBar();
    } else {
      hideBar();
    }
  });

  // Also show on touch devices when tapping near bottom
  document.addEventListener('touchmove', (e) => {
    if (e.touches[0].clientY > window.innerHeight - 120) {
      showBar();
    }
  });
</script>
